# ============================================================================
#  EntranceGateway CMS — Production Docker Compose (COOLIFY)
#
#  No database here — this app calls entrance-backend over HTTP only
#  (API_BASE_URL, server-side, via the Next.js proxy route at /api/proxy).
#  Coolify builds from ./Dockerfile (no registry), so NO `container_name:`.
# ============================================================================

services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${APP_PORT:-6030}:3000"
    env_file:
      - .env.production
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - coolify

networks:
  coolify:
    external: true
